name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cp .env.example .env && sed -i 's/^GITHUB_TOKEN=.*/GITHUB_TOKEN=dummy/' .env
      - run: docker compose config --quiet
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - run: pipx run yamllint -d '{extends: relaxed, rules: {line-length: {max: 160}}}' docker-compose.yml grafana/ .github/
      - run: python -m json.tool grafana/dashboards/pr_compliance.json > /dev/null

  smoke:
    name: end-to-end smoke (one small repo)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure a small run
        run: |
          cp .env.example .env
          sed -i "s/^GITHUB_TOKEN=.*/GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}/" .env
          sed -i 's/^REPO_ALLOWLIST=.*/REPO_ALLOWLIST=cli/' .env
          sed -i 's/^DQ_MIN_PRS=.*/DQ_MIN_PRS=0/' .env
          sed -i 's/^DQ_FRESHNESS_HOURS=.*/DQ_FRESHNESS_HOURS=100000/' .env
          echo "LOOKBACK_DAYS=60" >> .env
          echo "AIRFLOW_UID=$(id -u)" >> .env
          mkdir -p data logs
      - run: docker compose up -d --build --wait
      - name: Run the DAG once (in-process, no scheduler round-trips)
        run: docker compose exec -T airflow-scheduler airflow dags test pr_compliance
      - name: Assert rows were loaded
        run: |
          n=$(docker compose exec -T compliance-db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM pr_compliance"')
          echo "rows loaded: $n"
          test "$n" -gt 0
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs > compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: airflow-logs
          path: |
            logs/
            compose.log
      - run: docker compose down -v
        if: always()

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: docker build -t pr-compliance-airflow:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pr-compliance-airflow:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0" # report only: the base image is upstream's; we track, not block

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cp .env.example .env && sed -i 's/^GITHUB_TOKEN=.*/GITHUB_TOKEN=dummy/' .env
      - run: docker compose config --quiet
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: yamllint
        run: >-
          pipx run yamllint -d '{extends: relaxed, rules: {line-length: {max: 160}}}'
          docker-compose.yml grafana/ .github/
      - run: python -m json.tool grafana/dashboards/pr_compliance.json > /dev/null

  smoke:
    name: end-to-end smoke (one small repo)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure a small run
        run: |
          cp .env.example .env
          sed -i "s/^GITHUB_TOKEN=.*/GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}/" .env
          sed -i 's/^REPO_ALLOWLIST=.*/REPO_ALLOWLIST=cli/' .env
          sed -i 's/^DQ_MIN_PRS=.*/DQ_MIN_PRS=0/' .env
          sed -i 's/^DQ_FRESHNESS_HOURS=.*/DQ_FRESHNESS_HOURS=100000/' .env
          echo "LOOKBACK_DAYS=60" >> .env
          echo "AIRFLOW_UID=$(id -u)" >> .env
          mkdir -p data logs
      - run: docker compose up -d --build --wait
      # A real manual trigger through the scheduler (logical_date=None path). Not
      # `airflow dags test`: in 3.3 it crashes in DagRun.update_state on DAGs that
      # declare a deadline (DeadlineAlertModel.get_by_id gets a dict).
      - name: Trigger a run and wait for it
        timeout-minutes: 15
        run: |
          dc() { docker compose exec -T airflow-scheduler "$@"; }
          dc airflow dags trigger pr_compliance --run-id ci-smoke
          while :; do
            state=$(dc airflow dags list-runs pr_compliance -o json 2>/dev/null | python3 -c '
          import json, sys
          raw = sys.stdin.read()
          runs = json.loads(raw[raw.index("["):]) if "[" in raw else []
          print(next((r["state"] for r in runs if r["run_id"] == "ci-smoke"), "missing"))')
            echo "ci-smoke: $state"
            case "$state" in
              success) break ;;
              failed) exit 1 ;;
            esac
            sleep 10
          done
      - name: Assert rows were loaded
        run: |
          n=$(docker compose exec -T compliance-db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM pr_compliance"')
          echo "rows loaded: $n"
          test "$n" -gt 0
      - name: Collect logs on failure
        if: failure()
        # Airflow log paths contain ':' (run ids), which upload-artifact rejects: tar them.
        run: |
          docker compose logs > compose.log 2>&1 || true
          tar -czf airflow-logs.tgz logs/ compose.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: airflow-logs
          path: airflow-logs.tgz
      - run: docker compose down -v
        if: always()

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: docker build -t pr-compliance-airflow:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pr-compliance-airflow:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0" # report only: the base image is upstream's; we track, not block
